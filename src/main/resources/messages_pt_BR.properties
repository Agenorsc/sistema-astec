# Mensagens padrão de validação e internacionalização Spring MVC (pt-BR)
NotBlank.requisicaoNovoTicket.titulo=O título do chamado é obrigatório.
Size.requisicaoNovoTicket.titulo=O título deve conter entre 5 e 150 caracteres.
NotBlank.requisicaoNovoTicket.descricao=A descrição do problema é obrigatória.
NotNull.requisicaoNovoTicket.clienteId=Selecione o cliente solicitante.
NotNull.requisicaoNovoTicket.equipamentoId=Selecione o equipamento associado.
NotNull.requisicaoNovoTicket.urgencia=Selecione o nível de urgência.

NotBlank.requisicaoNovoEquipamento.nome=O nome do equipamento é obrigatório.
Size.requisicaoNovoEquipamento.nome=O nome deve conter entre 3 e 100 caracteres.
NotBlank.requisicaoNovoEquipamento.modelo=O modelo é obrigatório.
NotBlank.requisicaoNovoEquipamento.numeroSerie=O número de série é obrigatório.

NotNull.requisicaoAvaliacao.nota=Por favor, informe uma nota de 1 a 5 estrelas.
Min.requisicaoAvaliacao.nota=A nota mínima é 1 estrela.
Max.requisicaoAvaliacao.nota=A nota máxima é 5 estrelas.

NotBlank.requisicaoNovoLaudo.diagnosticoSolucao=O diagnóstico técnico e a solução são obrigatórios.
NotNull.requisicaoNovoLaudo.horasTrabalhadas=Informe o total de horas trabalhadas.
Min.requisicaoNovoLaudo.horasTrabalhadas=O tempo mínimo de trabalho é de 1 hora.
