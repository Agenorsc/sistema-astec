<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{base :: head}"></head>
<body>

    <div th:replace="~{base :: navbar}"></div>

    <div class="main-content">
        <div th:replace="~{base :: titulo('Cadastro de Equipamento')}"></div>

        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card shadow-sm">
                        <div class="card-header bg-white font-weight-bold">
                            <i class="fas fa-plus-circle mr-2 text-primary"></i>Novo Equipamento / Dispositivo
                        </div>
                        <div class="card-body">
                            <!-- Formulário Spring MVC com Bean Validation (Deck 4) -->
                            <form th:action="@{/equipamentos/novo}" th:object="${requisicaoNovoEquipamento}" method="POST">

                                <div class="form-group">
                                    <label for="nome" class="font-weight-bold">Nome / Tipo do Equipamento *</label>
                                    <input type="text" id="nome" th:field="*{nome}" th:errorclass="is-invalid"
                                           class="form-control" placeholder="Ex: Notebook Corporativo Dell Latitude">
                                    <div class="invalid-feedback" th:errors="*{nome}">
                                        Erros do nome
                                    </div>
                                </div>

                                <div class="form-row">
                                    <div class="form-group col-md-6">
                                        <label for="modelo" class="font-weight-bold">Modelo *</label>
                                        <input type="text" id="modelo" th:field="*{modelo}" th:errorclass="is-invalid"
                                               class="form-control" placeholder="Ex: Inspiron 15 3000">
                                        <div class="invalid-feedback" th:errors="*{modelo}">
                                            Erros do modelo
                                        </div>
                                    </div>

                                    <div class="form-group col-md-6">
                                        <label for="numeroSerie" class="font-weight-bold">Número de Série (S/N) *</label>
                                        <input type="text" id="numeroSerie" th:field="*{numeroSerie}" th:errorclass="is-invalid"
                                               class="form-control" placeholder="Ex: BR-DELL-883921">
                                        <div class="invalid-feedback" th:errors="*{numeroSerie}">
                                            Erros do número de série
                                        </div>
                                    </div>
                                </div>

                                <div class="form-group">
                                    <label for="categoriaIds" class="font-weight-bold">Categorias (@ManyToMany) - Segure CTRL para selecionar múltiplas</label>
                                    <select id="categoriaIds" th:field="*{categoriaIds}" class="form-control" multiple size="3">
                                        <option th:each="cat : ${categorias}" th:value="${cat.id}" th:text="${cat.nome} + ' - ' + ${cat.descricao}"></option>
                                    </select>
                                </div>

                                <div class="form-group">
                                    <label for="tagsTexto" class="font-weight-bold">Tags / Características (@ElementCollection)</label>
                                    <input type="text" id="tagsTexto" th:field="*{tagsTexto}" class="form-control" placeholder="Ex: Portátil, I7, SSD, Garantia (separadas por vírgula)">
                                    <small class="form-text text-muted">Informe as palavras-chave separadas por vírgula.</small>
                                </div>

                                <div class="d-flex justify-content-between mt-4">
                                    <a th:href="@{/equipamentos}" class="btn btn-outline-secondary">
                                        <i class="fas fa-arrow-left mr-1"></i>Voltar à Lista
                                    </a>
                                    <button type="submit" class="btn btn-primary px-4">
                                        <i class="fas fa-save mr-1"></i>Salvar Equipamento
                                    </button>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{base :: footer}"></div>

</body>
</html>
