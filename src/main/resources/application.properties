spring.application.name=sistema-astec
server.port=8080
spring.profiles.default=h2

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB

app.security.jwt.secret=${ASTEC_JWT_SECRET:}
app.security.jwt.expiration-seconds=3600
app.seed.demo-data=${ASTEC_SEED_DEMO_DATA:false}
app.bootstrap.admin.name=${ASTEC_BOOTSTRAP_ADMIN_NAME:}
app.bootstrap.admin.email=${ASTEC_BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin.password=${ASTEC_BOOTSTRAP_ADMIN_PASSWORD:}
app.attachments.directory=${ASTEC_ATTACHMENTS_DIRECTORY:./data/anexos}
app.notifications.from=${ASTEC_MAIL_FROM:no-reply@astec.local}
app.sla.critica.primeira-resposta=${ASTEC_SLA_CRITICA_RESPOSTA:PT1H}
app.sla.critica.resolucao=${ASTEC_SLA_CRITICA_RESOLUCAO:PT4H}
app.sla.alta.primeira-resposta=${ASTEC_SLA_ALTA_RESPOSTA:PT4H}
app.sla.alta.resolucao=${ASTEC_SLA_ALTA_RESOLUCAO:PT24H}
app.sla.media.primeira-resposta=${ASTEC_SLA_MEDIA_RESPOSTA:PT8H}
app.sla.media.resolucao=${ASTEC_SLA_MEDIA_RESOLUCAO:PT72H}
app.sla.baixa.primeira-resposta=${ASTEC_SLA_BAIXA_RESPOSTA:PT24H}
app.sla.baixa.resolucao=${ASTEC_SLA_BAIXA_RESOLUCAO:PT120H}
